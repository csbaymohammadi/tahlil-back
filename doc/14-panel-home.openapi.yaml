---
openapi: 3.1.0
info:
  title: 'Panel Home Analytics API'
  version: 1.0.0
  description: 'Backend implementation; external UI, traffic emitter and website revalidation receiver must be connected separately.'
servers:
  -
    url: /api/v1
components:
  securitySchemes:
    panelSession:
      type: apiKey
      in: cookie
      name: tahlil-panel-session-v2
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
          required:
            - code
            - message
            - fields
          additionalProperties: false
        request_id:
          type: string
      required:
        - error
        - request_id
      additionalProperties: false
    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        total_pages:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - page
        - per_page
        - total
        - total_pages
      additionalProperties: false
    HomeAnalytics:
      type: object
      properties:
        period:
          type: object
          properties:
            key:
              const: last_30_days
            timezone:
              const: Asia/Tehran
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
          required:
            - key
            - timezone
            - from
            - to
          additionalProperties: false
        generated_at:
          type: string
          format: date-time
        data_through:
          type: string
          format: date-time
        total_visits:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        devices:
          type: array
          items:
            type: object
            properties:
              id:
                enum:
                  - iphone
                  - android-phone
                  - mac
                  - windows
                  - ipad
                  - android-tablet
                  - other
              visits:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            required:
              - id
              - visits
            additionalProperties: false
          minItems: 6
          maxItems: 7
        top_links:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                minLength: 1
              path:
                type: string
                pattern: '^/(?!/)'
                maxLength: 2048
              visits:
                type: integer
                minimum: 1
                maximum: 9007199254740991
            required:
              - title
              - path
              - visits
            additionalProperties: false
          maxItems: 5
      required:
        - period
        - generated_at
        - data_through
        - total_visits
        - devices
        - top_links
      additionalProperties: false
    PageView:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        path:
          type: string
          maxLength: 2048
          minLength: 1
      required:
        - event_id
        - path
      additionalProperties: false
paths:
  /admin/dashboard/home:
    get:
      security:
        -
          panelSession: {  }
      responses:
        200:
          description: 'Successful response'
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HomeAnalytics'
                  request_id:
                    type: string
                required:
                  - data
                  - request_id
                additionalProperties: false
        401:
          description: 'Error; inspect error.code and request_id'
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          description: 'Error; inspect error.code and request_id'
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          description: 'Error; inspect error.code and request_id'
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: 'Error; inspect error.code and request_id'
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        503:
          description: 'Error; inspect error.code and request_id'
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /analytics/page-views:
    post:
      security: {  }
      responses:
        400:
          description: 'Error; inspect error.code and request_id'
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: 'Error; inspect error.code and request_id'
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: 'Error; inspect error.code and request_id'
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: 'Error; inspect error.code and request_id'
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        413:
          description: 'Error; inspect error.code and request_id'
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        415:
          description: 'Error; inspect error.code and request_id'
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          description: 'Error; inspect error.code and request_id'
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          description: 'Error; inspect error.code and request_id'
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: 'Error; inspect error.code and request_id'
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        503:
          description: 'Error; inspect error.code and request_id'
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        204:
          description: 'View accepted, matching retry deduplicated, or bot/prefetch ignored'
      parameters:
        -
          name: Origin
          in: header
          required: false
          schema:
            type: string
            format: uri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageView'
    options:
      security: {  }
      parameters:
        -
          name: Origin
          in: header
          required: false
          schema:
            type: string
            format: uri
      responses:
        204:
          description: 'Allowed collection preflight'
