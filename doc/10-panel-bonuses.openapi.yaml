                "$ref": "#/components/schemas/Error"
        '503':
          description: SERVICE_UNAVAILABLE
          headers:
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Includes no-store. Personalized rating data must not enter
                page caches.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RatingWrite"
            example:
              value: 5
      description: Only Published, non-deleted parents. Same value is idempotent;
        changed value replaces vote. Rating revision changes without advancing editorial
        version/dates. No panel login or caller-supplied voter identity.
    options:
      summary: Shared unrestricted rating CORS preflight
      security: []
      parameters:
      - "$ref": "#/components/parameters/Origin"
      - name: Access-Control-Request-Method
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: All origins, requested methods and headers accepted; credentialed reflected
            CORS. No voter context created.
