          headers:
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Includes no-store.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Create immediately public tutorial; body at most 256 KiB
      security:
      - panelSession: []
      parameters:
      - "$ref": "#/components/parameters/Csrf"
      responses:
        '201':
          description: Canonical committed result
          headers:
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Includes no-store.
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TutorialResponse"
