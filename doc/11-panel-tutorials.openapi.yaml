              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: VALIDATION_FAILED
          headers:
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Includes no-store.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
