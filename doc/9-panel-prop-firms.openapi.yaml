---
openapi: 3.1.0
info:
  title: Prop Firms Admin API
  version: 1.0.0
  description: Private panel API with the existing active panel-session management
    boundary. Public resolvers and durable Outbox are internal services; public HTTP
    routes and cache delivery are separate integration work.
servers:
- url: "/api/v1/admin"
  description: Relative API base path
security:
- panelSession: []
tags:
- name: Profiles
- name: Categories
paths:
  "/prop-firms/items":
    get:
      tags:
      - Profiles
      summary: List profiles
      parameters:
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/PerPage"
      - "$ref": "#/components/parameters/Search"
      responses:
        '200':
          description: Draft and published profiles, newest first
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileListResponse"
          headers:
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Includes no-store.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
    post:
      tags:
      - Profiles
      summary: Create profile
      description: Requires a panel session and CSRF token. Maximum body size is 2
        MiB.
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfileCreate"
            example:
              title: Example Prop Firm
              english_name: Example Firm
              slug: example-prop-firm
              category_id:
              logo: ''
              website_url: ''
              content: "<h2>Overview</h2><p>Evaluation and payout conditions.</p>"
              status: published
              specifications:
                trial_account: 'yes'
                evaluation_type: Two stages
                daily_loss_limit: 5% daily; resets at 00:00 UTC
                total_loss_limit: 10% trailing equity
                payout_rules: Monthly; subject to eligibility
      responses:
        '201':
          description: Created; Location points to management detail
          headers:
            Location:
              schema:
                type: string
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Includes no-store.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileDetailResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '400':
          "$ref": "#/components/responses/InvalidJson"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
  "/prop-firms/items/{id}":
    parameters:
    - "$ref": "#/components/parameters/Id"
    get:
      tags:
      - Profiles
      summary: Get profile detail
      responses:
        '200':
          description: Full profile, including all 23 specifications
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileDetailResponse"
          headers:
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Includes no-store.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
    patch:
      tags:
      - Profiles
      summary: Partially update profile
      description: Requires expected_version and at least one profile field. Specifications
        merge by key.
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfilePatch"
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileDetailResponse"
          headers:
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Includes no-store.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '400':
          "$ref": "#/components/responses/InvalidJson"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
    delete:
      tags:
      - Profiles
      summary: Soft-delete profile
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      - name: expected_version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      responses:
        '204':
          description: Deleted; slug and media references remain reserved
          headers:
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Includes no-store.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/prop-firms/categories":
    get:
      tags:
      - Categories
      summary: List categories
      parameters:
      - "$ref": "#/components/parameters/Search"
      responses:
        '200':
          description: Live categories sorted by normalized name and ID
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - request_id
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Category"
                  request_id:
                    type: string
          headers:
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Includes no-store.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
    post:
      tags:
      - Categories
      summary: Create category
      description: Maximum body size is 16 KiB. Deleted category names remain reserved.
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  example: Gold Platform Services
      responses:
        '201':
          description: Created category
          headers:
            Location:
              schema:
                type: string
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Includes no-store.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CategoryResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '400':
          "$ref": "#/components/responses/InvalidJson"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
  "/prop-firms/categories/{id}":
    parameters:
    - "$ref": "#/components/parameters/Id"
    get:
      tags:
      - Categories
      summary: Get category
      responses:
        '200':
          description: Category and live profile count
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CategoryResponse"
          headers:
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Includes no-store.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
    delete:
      tags:
      - Categories
      summary: Delete category and uncategorize live profiles
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      - name: expected_version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      responses:
        '200':
          description: Deleted category; affected count is the transactional update
            count
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - request_id
                properties:
                  data:
                    type: object
                    required:
                    - deleted_category_id
                    - affected_prop_firm_count
                    properties:
                      deleted_category_id:
                        type: integer
                      affected_prop_firm_count:
                        type: integer
                        minimum: 0
                  request_id:
                    type: string
          headers:
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Includes no-store.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/prop-firms/categories/{id}/merge":
    parameters:
    - "$ref": "#/components/parameters/Id"
    post:
      tags:
      - Categories
      summary: Merge a category into another
      description: Source and target versions are checked. Transfer and soft-delete
        run atomically under the shared mutation lock.
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expected_version
              - target_category_id
              - target_expected_version
              properties:
                expected_version:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
                target_category_id:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
                target_expected_version:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
      responses:
        '200':
          description: Merge result; moved count is the transactional update count
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - request_id
                properties:
                  data:
                    type: object
                    required:
                    - source_category_id
                    - target_category_id
                    - moved_prop_firm_count
                    properties:
                      source_category_id:
                        type: integer
                      target_category_id:
                        type: integer
                      moved_prop_firm_count:
                        type: integer
                        minimum: 0
                  request_id:
                    type: string
          headers:
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Includes no-store.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '400':
          "$ref": "#/components/responses/InvalidJson"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
components:
  securitySchemes:
    panelSession:
      type: apiKey
      in: cookie
      name: tahlil-panel-session-v2
      description: Authenticated panel session. Mutations also require X-CSRF-Token.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 9007199254740991
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
        maximum: 9007199254740991
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        enum:
        - 10
        - 20
        - 50
        default: 10
    Search:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
  schemas:
    ProfileListResponse:
      type: object
      required:
      - data
      - meta
      - request_id
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Profile"
        meta:
          type: object
          required:
          - page
          - per_page
          - total
          - total_pages
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer
        request_id:
          type: string
    ProfileDetailResponse:
      type: object
      required:
      - data
      - request_id
      properties:
        data:
          "$ref": "#/components/schemas/ProfileDetail"
        request_id:
          type: string
    Profile:
      type: object
      required:
      - id
      - title
      - english_name
      - slug
      - description
      - logo
      - website_url
      - founded_year
      - kind
      - status
      - author
      - category_id
      - category
      - created_at
      - updated_at
      - published_at
      - public_path
      - version
      properties:
        id:
          type: integer
        title:
          type: string
          maxLength: 120
        english_name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 120
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
        logo:
          type: string
        website_url:
          type: string
        founded_year:
          type: string
        kind:
          type: string
          const: prop-firms
        status:
          type: string
          enum:
          - draft
          - published
        author:
          oneOf:
          - type: 'null'
          - type: object
            required:
            - id
            - name
            properties:
              id:
                type: integer
              name:
                type: string
        category_id:
          oneOf:
          - type: integer
          - type: 'null'
        category:
          oneOf:
          - type: 'null'
          - type: object
            required:
            - id
            - name
            properties:
              id:
                type: integer
              name:
                type: string
        created_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        updated_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        published_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        public_path:
          oneOf:
          - type: string
          - type: 'null'
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    ProfileDetail:
      allOf:
      - "$ref": "#/components/schemas/Profile"
      - type: object
        required:
        - content
        - meta_description
        - specifications
        properties:
          content:
            type: string
            description: Canonical sanitized HTML; at most 1 MiB in decoded UTF-8
              bytes.
            x-maxBytes: 1048576
          meta_description:
            type: string
            maxLength: 500
          specifications:
            "$ref": "#/components/schemas/SpecificationsDetail"
    ProfileCreate:
      allOf:
      - "$ref": "#/components/schemas/ProfileFields"
      - type: object
        required:
        - title
        - english_name
        - slug
        - content
        - status
        - category_id
      unevaluatedProperties: false
    ProfilePatch:
      allOf:
      - "$ref": "#/components/schemas/ProfileFields"
      - type: object
        required:
        - expected_version
        properties:
          expected_version:
            type: integer
            minimum: 1
            maximum: 9007199254740991
      unevaluatedProperties: false
      minProperties: 2
      description: Requires expected_version and at least one editable field; an empty
        specifications object is a valid no-op. Only category_id accepts null.
    ProfileFields:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        english_name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
          maxLength: 2000
          default: ''
        logo:
          type: string
          maxLength: 2048
          description: Optional; empty string clears it.
          default: ''
        website_url:
          type: string
          maxLength: 2048
          description: Optional HTTP/HTTPS URL without credentials; empty string clears
            it.
          default: ''
        founded_year:
          type: string
          pattern: "^(?:|[0-9]{4})$"
          default: ''
        specifications:
          "$ref": "#/components/schemas/Specifications"
          description: 'Five groups in order: General Information, Features, Trading
            Conditions, Fees, Licenses. Editorial limits are descriptive text and
            never executable trading rules.'
        category_id:
          oneOf:
          - type: integer
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
        content:
          type: string
          description: Sanitized HTML
          at most 1 MiB in UTF-8 bytes.:
          x-maxBytes: 1048576
        meta_description:
          type: string
          maxLength: 500
          default: ''
        status:
          type: string
          enum:
          - draft
          - published
    Specifications:
      type: object
      additionalProperties: false
      description: Responses always include 23 keys. Create omissions become empty
        strings; PATCH merges supplied keys and an empty object does not change specifications.
      properties:
        established_at:
          "$ref": "#/components/schemas/EditorialSpecification"
        head_office_address:
          "$ref": "#/components/schemas/EditorialSpecification"
        physical_branch_count:
          "$ref": "#/components/schemas/EditorialSpecification"
        years_active:
          "$ref": "#/components/schemas/EditorialSpecification"
        minimum_deposit:
          "$ref": "#/components/schemas/EditorialSpecification"
        maximum_withdrawal:
          "$ref": "#/components/schemas/EditorialSpecification"
        in_person_visit:
          "$ref": "#/components/schemas/StatusSpecification"
        address_transparency:
          "$ref": "#/components/schemas/StatusSpecification"
        active_social_media:
          "$ref": "#/components/schemas/StatusSpecification"
        around_the_clock_support:
          "$ref": "#/components/schemas/StatusSpecification"
        support_availability:
          "$ref": "#/components/schemas/StatusSpecification"
        trial_account:
          "$ref": "#/components/schemas/StatusSpecification"
        identity_documents:
          "$ref": "#/components/schemas/EditorialSpecification"
        dedicated_app:
          "$ref": "#/components/schemas/StatusSpecification"
        evaluation_type:
          "$ref": "#/components/schemas/EditorialSpecification"
        daily_loss_limit:
          "$ref": "#/components/schemas/EditorialSpecification"
        total_loss_limit:
          "$ref": "#/components/schemas/EditorialSpecification"
        payout_rules:
          "$ref": "#/components/schemas/EditorialSpecification"
        trading_fee:
          "$ref": "#/components/schemas/EditorialSpecification"
        registration_fee:
          "$ref": "#/components/schemas/EditorialSpecification"
        inamad:
          "$ref": "#/components/schemas/StatusSpecification"
        virtual_business_union:
          "$ref": "#/components/schemas/StatusSpecification"
        computer_trade_organization:
          "$ref": "#/components/schemas/StatusSpecification"
    EditorialSpecification:
      type: string
      maxLength: 1500
      description: Plain text; empty means unspecified, not zero.
      default: ''
    StatusSpecification:
      type: string
      enum:
      - ''
      - 'yes'
      - 'no'
      - not-applicable
      default: ''
    Category:
      type: object
      required:
      - id
      - name
      - prop_firm_count
      - created_at
      - updated_at
      - version
      properties:
        id:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 80
        prop_firm_count:
          type: integer
          minimum: 0
        created_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        updated_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    CategoryResponse:
      type: object
      required:
      - data
      - request_id
      properties:
        data:
          "$ref": "#/components/schemas/Category"
        request_id:
          type: string
    ErrorResponse:
      type: object
      required:
      - error
      - request_id
      properties:
        error:
          type: object
          required:
          - code
          - message
          - fields
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
        request_id:
          type: string
    SpecificationsDetail:
      type: object
      additionalProperties: false
      description: Responses always include 23 keys. Create omissions become empty
        strings; PATCH merges supplied keys and an empty object does not change specifications.
      properties:
        established_at:
          "$ref": "#/components/schemas/EditorialSpecification"
        head_office_address:
          "$ref": "#/components/schemas/EditorialSpecification"
        physical_branch_count:
          "$ref": "#/components/schemas/EditorialSpecification"
        years_active:
          "$ref": "#/components/schemas/EditorialSpecification"
        minimum_deposit:
          "$ref": "#/components/schemas/EditorialSpecification"
        maximum_withdrawal:
          "$ref": "#/components/schemas/EditorialSpecification"
        in_person_visit:
          "$ref": "#/components/schemas/StatusSpecification"
