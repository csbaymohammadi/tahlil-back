  responses:
    Unauthorized:
      description: Missing or expired panel session
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Invalid CSRF token or insufficient permission
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: Missing or soft-deleted resource in this domain
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Conflict:
      description: Stale expected_version or reserved slug/category name
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Invalid input, unsupported HTML, or domain mismatch
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Profile body exceeds 2 MiB or category body exceeds 16 KiB
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Mutation limit is 300 requests per 15 minutes per panel user and
        domain
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Wait this many seconds before retrying.
    InvalidJson:
      description: Malformed JSON (INVALID_JSON).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Send application/json (UNSUPPORTED_MEDIA_TYPE).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    InternalError:
      description: Controlled unexpected failure (INTERNAL_ERROR).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Database or shared infrastructure unavailable (SERVICE_UNAVAILABLE).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
