---
openapi: 3.1.0
info:
  title: 'Panel Page Settings API'
  version: 1.0.0
  description: 'Backend implementation; external UI, traffic emitter and website revalidation receiver must be connected separately.'
servers:
  -
    url: /api/v1
components:
  securitySchemes:
    panelSession:
      type: apiKey
      in: cookie
      name: tahlil-panel-session-v2
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
          required:
            - code
            - message
            - fields
          additionalProperties: false
        request_id:
          type: string
      required:
        - error
        - request_id
      additionalProperties: false
    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        total_pages:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - page
        - per_page
        - total
        - total_pages
      additionalProperties: false
    Hero:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        accent:
          type: string
          minLength: 0
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 2000
        primary_label:
          type: string
          minLength: 1
          maxLength: 120
        primary_url:
          type: string
          minLength: 1
          maxLength: 2048
        secondary_label:
          type: string
          minLength: 1
          maxLength: 120
        secondary_mobile_label:
          type: string
          minLength: 1
          maxLength: 120
        secondary_url:
          type: string
          minLength: 1
          maxLength: 2048
      required:
        - title
        - accent
        - description
        - primary_label
        - primary_url
        - secondary_label
        - secondary_mobile_label
        - secondary_url
      additionalProperties: false
    Section:
      oneOf:
        -
          type: object
          properties:
            key:
              const: exchanges
            kind:
              const: exchange
            title:
              type: string
              minLength: 1
              maxLength: 200
            description:
              type: string
              minLength: 0
              maxLength: 2000
            action_label:
              type: string
              minLength: 1
              maxLength: 120
            action_url:
              type: string
              minLength: 1
              maxLength: 2048
            selected_ids:
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 9007199254740991
              uniqueItems: true
          required:
            - key
            - kind
            - title
            - description
            - action_label
            - action_url
            - selected_ids
          additionalProperties: false
        -
          type: object
          properties:
            key:
              const: aparat
            kind:
              const: video
            title:
              type: string
              minLength: 1
              maxLength: 200
            description:
              type: string
              minLength: 0
              maxLength: 2000
            action_label:
              type: string
              minLength: 1
              maxLength: 120
            action_url:
              type: string
              minLength: 1
              maxLength: 2048
            selected_ids:
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 9007199254740991
              uniqueItems: true
          required:
            - key
            - kind
            - title
            - description
            - action_label
            - action_url
            - selected_ids
          additionalProperties: false
        -
          type: object
          properties:
            key:
              const: news
            kind:
              const: news
            title:
              type: string
              minLength: 1
              maxLength: 200
            description:
              type: string
              minLength: 0
              maxLength: 2000
            action_label:
              type: string
              minLength: 1
              maxLength: 120
            action_url:
              type: string
              minLength: 1
              maxLength: 2048
            selected_ids:
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 9007199254740991
              uniqueItems: true
          required:
            - key
            - kind
            - title
            - description
            - action_label
            - action_url
            - selected_ids
          additionalProperties: false
        -
          type: object
          properties:
            key:
              const: bonuses
            kind:
              const: bonus
            title:
              type: string
              minLength: 1
              maxLength: 200
            description:
              type: string
              minLength: 0
              maxLength: 2000
            action_label:
              type: string
              minLength: 1
              maxLength: 120
            action_url:
              type: string
              minLength: 1
              maxLength: 2048
            selected_ids:
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 9007199254740991
              uniqueItems: true
          required:
            - key
            - kind
            - title
            - description
            - action_label
            - action_url
            - selected_ids
          additionalProperties: false
        -
          type: object
          properties:
            key:
              const: videos
            kind:
              const: video
            title:
              type: string
              minLength: 1
              maxLength: 200
            description:
              type: string
              minLength: 0
              maxLength: 2000
            action_label:
              type: string
              minLength: 1
              maxLength: 120
            action_url:
              type: string
              minLength: 1
              maxLength: 2048
            selected_ids:
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 9007199254740991
              uniqueItems: true
          required:
            - key
            - kind
            - title
            - description
            - action_label
            - action_url
            - selected_ids
          additionalProperties: false
        -
          type: object
          properties:
            key:
              const: articles
            kind:
              const: article
            title:
              type: string
              minLength: 1
              maxLength: 200
            description:
              type: string
              minLength: 0
              maxLength: 2000
            action_label:
              type: string
              minLength: 1
              maxLength: 120
            action_url:
              type: string
              minLength: 1
              maxLength: 2048
            selected_ids:
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 9007199254740991
              uniqueItems: true
          required:
            - key
            - kind
            - title
            - description
            - action_label
            - action_url
            - selected_ids
          additionalProperties: false
    Links:
      type: object
      properties:
        telegram:
          type: string
          minLength: 0
          maxLength: 2048
        instagram:
          type: string
          minLength: 0
          maxLength: 2048
        youtube:
          type: string
          minLength: 0
          maxLength: 2048
        aparat:
          type: string
          minLength: 0
          maxLength: 2048
      required:
        - telegram
        - instagram
        - youtube
        - aparat
      additionalProperties: false
    Ad:
      type: object
      properties:
        image:
          type: string
          minLength: 1
          maxLength: 2048
        link:
          type: string
          minLength: 1
          maxLength: 2048
      required:
        - image
        - link
      additionalProperties: false
    Logo:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'
        logo_src:
          type: string
          minLength: 1
          maxLength: 2048
        name:
          type: string
          minLength: 1
          maxLength: 120
        english_name:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - id
        - logo_src
        - name
        - english_name
      additionalProperties: false
    SettingsWrite:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        hero:
          $ref: '#/components/schemas/Hero'
        carousels:
          type: array
          items:
            $ref: '#/components/schemas/Section'
          minItems: 6
          maxItems: 6
        menu:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                enum:
                  - exchanges
                  - forex
                  - stock-brokers
                  - gold-platforms
                  - prop-firms
              selected_ids:
                type: array
                items:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
                maxItems: 9
                uniqueItems: true
            required:
              - key
              - selected_ids
            additionalProperties: false
          minItems: 5
          maxItems: 5
        links:
          $ref: '#/components/schemas/Links'
        advertisements:
          type: object
          properties:
            home_header:
              type: array
              items:
                $ref: '#/components/schemas/Ad'
            news_and_articles:
              type: array
              items:
                $ref: '#/components/schemas/Ad'
          required:
            - home_header
            - news_and_articles
          additionalProperties: false
        infinite_slider:
          type: array
          items:
            $ref: '#/components/schemas/Logo'
      required:
        - expected_version
        - hero
        - carousels
        - menu
        - links
        - advertisements
        - infinite_slider
      additionalProperties: false
    SettingsRead:
      type: object
      properties:
        hero:
          $ref: '#/components/schemas/Hero'
        carousels:
          type: array
          items:
            $ref: '#/components/schemas/Section'
          minItems: 6
          maxItems: 6
        menu:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                enum:
                  - exchanges
                  - forex
                  - stock-brokers
                  - gold-platforms
                  - prop-firms
              selected_ids:
                type: array
                items:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
                maxItems: 9
                uniqueItems: true
            required:
              - key
              - selected_ids
            additionalProperties: false
          minItems: 5
          maxItems: 5
        links:
          $ref: '#/components/schemas/Links'
        advertisements:
          type: object
          properties:
            home_header:
              type: array
              items:
                $ref: '#/components/schemas/Ad'
            news_and_articles:
              type: array
              items:
                $ref: '#/components/schemas/Ad'
          required:
            - home_header
            - news_and_articles
          additionalProperties: false
        infinite_slider:
          type: array
          items:
            $ref: '#/components/schemas/Logo'
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        selection_details:
          type: object
          properties:
            home:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          minimum: 1
                          maximum: 9007199254740991
                        title:
                          type: string
                        eligible:
                          type: boolean
                        reason:
                          type:
                            - string
                            - 'null'
                          enum:
                            - null
                            - unpublished
                            - scheduled
                            - deleted
                            - not_found
                            - invalid_aparat_source
                      required:
                        - id
                        - title
                        - eligible
                        - reason
                      additionalProperties: false
                required:
                  - key
                  - items
                additionalProperties: false
            menu:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          minimum: 1
                          maximum: 9007199254740991
                        title:
                          type: string
                        eligible:
                          type: boolean
                        reason:
                          type:
                            - string
                            - 'null'
                          enum:
                            - null
                            - unpublished
                            - scheduled
                            - deleted
                            - not_found
                            - invalid_aparat_source
                      required:
                        - id
                        - title
                        - eligible
                        - reason
                      additionalProperties: false
                required:
                  - key
                  - items
                additionalProperties: false
          required:
            - home
            - menu
          additionalProperties: false
      required:
        - hero
        - carousels
        - menu
        - links
        - advertisements
        - infinite_slider
        - version
        - created_at
        - updated_at
        - selection_details
      additionalProperties: false
    Author:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        name:
          type: string
        bio:
          type: string
        linkedin_url:
          type: string
        avatar_url:
          type:
            - string
            - 'null'
      required:
        - id
        - name
        - bio
        - linkedin_url
        - avatar_url
      additionalProperties: false
    ExchangeCard:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        title:
          type: string
        slug:
          type: string
        public_path:
          type: string
        english_name:
          type: string
        logo:
          type: string
        founded_year:
          type: string
        platform_type:
          type: string
        category:
          anyOf:
            -
              type: object
              properties:
                id:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
                name:
                  type: string
                key:
                  type: string
              required:
                - id
                - name
              additionalProperties: false
            -
              type: 'null'
        rating_average:
          type:
            - number
            - 'null'
        rating_count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        comment_count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - id
        - title
        - slug
        - public_path
        - english_name
        - logo
        - founded_year
        - platform_type
        - category
        - rating_average
        - rating_count
        - comment_count
      additionalProperties: false
    PlatformCard:
      type: object
      properties:
        id:
          type: integer
